name: CI

on:
    pull_request:
    push:
        branches: [main]

# Every run shares one Neon test branch - two runs at once would collide on
# the same fixtures (the test suite itself runs files sequentially for the
# same reason, see vitest.config.ts).
concurrency:
    group: neon-test-branch
    cancel-in-progress: false

jobs:
    checks:
        runs-on: ubuntu-latest
        env:
            # Neon "test" branch, never dev/prod: tests write real rows and
            # `npm test` runs `prisma migrate deploy` against it first. The
            # build reads services from the DB for static pages too.
            DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
            DATABASE_URL_UNPOOLED: ${{ secrets.TEST_DATABASE_URL_UNPOOLED }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - name: Typecheck
              run: npm run typecheck

            - name: Lint
              run: npm run lint

            - name: Formatting
              run: npx prettier --check "**/*.{ts,tsx}"

            - name: Tests
              run: npm test -- --run

            # Only the framework build - the `build` script also runs
            # `prisma migrate deploy`, which belongs to the Vercel deploy.
            - name: Build
              run: npx next build
