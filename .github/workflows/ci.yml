name: CI

on:
    pull_request:
    push:
        branches: [main]

# A new push to the same branch/PR cancels its older run. A single global
# group would serialize all runs on the shared Neon test branch, but GitHub
# keeps only one pending run per group and silently cancels the rest, so
# PRs ended up with cancelled checks. Runs of different PRs can therefore
# overlap on the test branch - fine for one developer, re-run if two ever
# collide.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        runs-on: ubuntu-latest
        env:
            # Neon "test" branch, never dev/prod: tests write real rows and
            # `npm test` runs `prisma migrate deploy` against it first. The
            # build reads services from the DB for static pages too.
            DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
            DATABASE_URL_UNPOOLED: ${{ secrets.TEST_DATABASE_URL_UNPOOLED }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  # Same major as Vercel (package.json "engines").
                  node-version: 24
                  cache: npm

            - run: npm ci

            - name: Typecheck
              run: npm run typecheck

            - name: Lint
              run: npm run lint

            - name: Formatting
              run: npx prettier --check "**/*.{ts,tsx}"

            # Coverage is informational, see vitest.config.ts. The summary
            # lands in the job log.
            - name: Tests
              run: npm run test:coverage

            # Runs after the tests' `prisma migrate deploy`, so the test
            # branch holds exactly what the migrations create. A schema.prisma
            # change without a migration shows up as a diff (exit code 2).
            # Constraints Prisma can't model (Booking_no_overlap) aren't
            # compared, so they don't trip it.
            - name: Schema matches migrations
              run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

            # Only the framework build - the `build` script also runs
            # `prisma migrate deploy`, which belongs to the Vercel deploy.
            - name: Build
              run: npx next build
